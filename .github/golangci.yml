# golangci-lint (схема v2) — конфиг ЭТОГО репозитория.
#
# ВЫВЕДЕН ИЗ КОРНЕВОГО `.golangci.yml` МОНОРЕПО, а не написан заново: дерево
# фундамента приезжает сюда производителем из `pkg/` монорепо, поэтому линтовать
# его вторым набором правил значило бы завести два места об одном предмете.
# Набор линтеров, их настройки и `issues.max-*` перенесены дословно.
#
# ПЕРЕНЕСЕНО НЕ ВСЁ, И КАЖДОЕ ИЗЪЯТИЕ — ЗАМЕР, А НЕ ВКУС. Исключение живёт,
# пока у него есть предмет; запись, которой нечего исключать, — слепая зона,
# выданная вперёд, и она не истечёт сама никогда. Замер по дереву на день
# заведения (`git ls-files`, единица — отслеживаемый файл):
#
#   исключение монорепо                  предмет здесь   решение
#   ─────────────────────────────────────────────────────────────
#   ^ui-future/                          0               снято
#   (^|/)node_modules($|/)               0               снято
#   services/iam/internal/(...)          0               снято
#   ^internal/(domain|errors|repo|...)/  0               снято (здесь только
#                                                        internal/tlsutil)
#   internal/(domain|handler|service|
#             apps/(kacho|kaname)/...)   0               снято
#   path: 'pkg/api/'                     12              ПЕРЕВЕДЕНО в '^api/'
#   path: '_test\.go$'                   257             оставлено
#   misspell requrie                     2               оставлено
#   errcheck exclude-functions           —               оставлено
#   QF1008|QF1011                        —               оставлено
#
# ПУТЬ СТАБОВ ПЕРЕВЕДЁН, А НЕ СКОПИРОВАН. Корень этого репозитория И ЕСТЬ `pkg/`
# монорепо, поэтому её `pkg/api/` здесь — `api/`. Скопируй запись дословно, и
# она не совпала бы НИ С ОДНИМ файлом: исключение осталось бы на вид рабочим, а
# сгенерённые стабы линтовались бы наравне с рукописным кодом. Предикат:
# `git ls-files 'api/*' | wc -l` → 12, из них `.pb.go` → 10.
version: "2"

run:
  timeout: 3m
  tests: true
  # НЕСУЩАЯ СТРОКА, А НЕ НАСТРОЙКА ВЫВОДА. Схема v2 по умолчанию считает пути
  # ОТ КАТАЛОГА КОНФИГА, а конфиг лежит в `.github/`. Значит без неё линтер
  # печатает `../api/...`, и якорное исключение `^api/` ниже не совпадает НИ С
  # ЧЕМ — молча, без предупреждения: запись остаётся на вид рабочей, а стабы
  # линтуются наравне с рукописным кодом.
  #
  # ЗДЕСЬ ЭТО ИЗМЕРЕНО, А НЕ ПЕРЕНЕСЕНО НА ВЕРУ. Инъекция при заведении конфига:
  # то же нарушение (`unused`) внутри `api/` — без этой строки прогон КРАСНЫЙ
  # (исключение не применилось), с ней МОЛЧИТ. Законный близнец в обычном
  # пакете краснеет в обоих случаях, то есть строка не глушит проверку вообще.
  #
  # `gomod` привязывает отсчёт к корню модуля — к тому же началу пути, от
  # которого писались якоря.
  relative-path-mode: gomod

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - revive
    - bodyclose
    - copyloopvar

  settings:
    misspell:
      # `requrie` — НАМЕРЕННАЯ опечатка, а не недосмотр: она вход пробы
      # `db/sslmode_test.go` и предмет объяснения в `db/sslmode.go`, где сказано,
      # почему перечисляются ДОПУСТИМЫЕ значения, а не запрещённые (перечень
      # запретов пропустил бы `sslmode=requrie` как безопасный). Директива
      # `nolint` внутри комментарного блока не действует — отсюда словарь.
      ignore-rules:
        - requrie
    revive:
      rules:
        - name: var-naming
        - name: package-comments
          disabled: true
        - name: exported
          disabled: true
        - name: unused-parameter
          disabled: true
        - name: unused-receiver
          disabled: true
    errcheck:
      # defer X.Close() — стандартная практика, не дефект: ошибка на закрытии
      # неисполнима, мы уже выходим из функции.
      exclude-functions:
        - (*github.com/jackc/pgx/v5/pgxpool.Pool).Close
        - (*google.golang.org/grpc.ClientConn).Close
        - (*database/sql.DB).Close
        - (*os.File).Close
        - (io.Closer).Close

  exclusions:
    rules:
      # Сгенерённые стабы: их пишет генератор, линтить бессмысленно.
      - path: '^api/'
        linters: [revive, staticcheck, unused, govet, errcheck]
      - path: '_test\.go$'
        linters: [revive, errcheck, unused, staticcheck, bodyclose]
      # Косметические quickfix'ы staticcheck. QF1011 вдобавок воюет с
      # НАМЕРЕННЫМИ compile-time type-assertion'ами.
      - linters: [staticcheck]
        text: 'QF1008|QF1011'

formatters:
  enable:
    - gofmt
    - goimports
  # Форматтеры — ОТДЕЛЬНЫЙ блок со своими исключениями: записи из
  # `linters.exclusions` на них НЕ распространяются. В монорепо этот класс уже
  # наблюдался: явно исключённые из линтеров стабы всё равно проверялись на
  # форматирование и давали полсотни замечаний, то есть гейт линта был красным
  # независимо от содержимого веток.
  exclusions:
    paths:
      - ^api/

issues:
  # 0 = БЕЗ ОГРАНИЧЕНИЯ, и это здесь единственное защитимое значение.
  # Потолок отбрасывает находки МОЛЧА: в выводе не остаётся ни числа
  # отброшенных, ни следа их существования, при том что прогон выглядит
  # содержательным. Отбрасываются РАЗНЫЕ находки, а не повторы одной, — то есть
  # исчезнуть может ровно та, ради которой линтер и запускался.
  max-same-issues: 0
  max-issues-per-linter: 0
