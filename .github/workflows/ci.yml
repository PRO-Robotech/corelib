# ci — единственный гейт этого репозитория.
#
# Фундамент опубликован отдельным репозиторием, а проверялся до сих пор ТОЛЬКО
# в монорепо, откуда его дерево приезжает производителем. По опубликованному
# артефакту не прогонялось НИЧЕГО: `.github/` здесь не было ни одним файлом
# (предикат: `gh api repos/PRO-Robotech/corelib/contents/.github` → 404), и
# защиты ствола тоже не было (`…/branches/main/protection` → 404). То есть
# модуль, который потребители тянут пином, был опубликован и никем не проверен:
# в ствол можно было отправить что угодно, и ни один вердикт этого не заметил бы.
#
# ФОРМА ВЗЯТА У КОНВЕЙЕРА СЛУЖБЫ (`PRO-Robotech/kaname`), НО НЕ СКОПИРОВАНА.
# Состав у фундамента другой, и каждое отличие — замер, а не вкус:
#
#   задание службы                        здесь   почему
#   ────────────────────────────────────────────────────────────────────────
#   сборка · vet · gofmt                  есть    измерено: rc 0
#   пробы -race -short                    есть    1703 события проб, 189 пропусков
#   golangci-lint (пин v2.12.2)           есть    конфиг переведён, 0 находок
#   gosec (пин v2.28.0)                   есть    —
#   интеграция (Postgres в контейнерах)   есть    13 пакетов, 37 файлов проб
#   govulncheck                           есть    —
#   listauthz — списочные методы сужены   НЕТ     предмета нет, см. ниже
#
# ЗАДАНИЯ listauthz ЗДЕСЬ НЕТ, И ЭТО РЕШЕНИЕ ПО ЗАМЕРУ. Гейт службы зовёт
# `./tools/audit-list-filter.sh`; в этом дереве такого файла нет
# (`git ls-files | grep -c '^tools/'` → 0), и завести его копией было бы
# неверно: гейт судит СПИСОЧНЫЕ RPC СЕРВИСА, а фундамент своих служб не несёт
# вовсе (`git ls-files '*.proto' | wc -l` → 0). В монорепо этот гейт живёт
# ровно в сервисных каталогах (`services/*/tools/audit-list-filter.sh`).
# Фундамент даёт БИБЛИОТЕКУ, которой сервисы сужают выдачу (`listfiltergate`,
# `listnarrow`), и она проверяется своими пробами в общем прогоне. Задание без
# предмета зеленело бы всегда — то есть было бы формой без содержания.
#
# ШАГА `vet -tags=integration` ЗДЕСЬ ТОЖЕ НЕТ. В службе он обязателен: там
# контейнерные пробы отделены `//go:build integration`, и без него тегированный
# файл не проверялся бы на собираемость ни в одном шаге. Здесь файлов с тегом
# сборки НОЛЬ (`git ls-files '*_test.go' | xargs grep -lE '^//go:build' | wc -l`
# → 0): разделяет прогоны `-short`, а не тег. Шаг выбрал бы пустое множество и
# был бы исключением без предмета.
#
# ВЕРСИИ ИНСТРУМЕНТОВ ВЗЯТЫ ИЗ ОБЪЯВЛЕНИЙ МОНОРЕПО, а не из того, что стоит в
# системе: golangci-lint v2.12.2 (`.github/workflows/ci.yaml`) и gosec v2.28.0
# (`.github/workflows/security-scan.yml`). Расхождение версии даёт вердикт о
# другом: новый релиз добавляет правило, и ствол краснеет на коммите, который
# ничего не трогал, а воспроизвести это локально нельзя вовсе.
#
# КЭША ЗДЕСЬ НЕ ЗАВОДИТСЯ РУКАМИ — НАМЕРЕННО. Рукописный кэш обязан нести в
# условии сохранения функцию состояния (`always()`, `!cancelled()`), иначе
# прогон, упавший на шаге, чью предпосылку он кэширует, наполнить кэш не может
# ПО ПОСТРОЕНИЮ. Класс закрыт тем, что предмета у него нет: кэш модулей ведёт
# `actions/setup-go` своим шагом, а своего мы не добавляем.
name: ci

on:
  # Сужено по ветке НАМЕРЕННО. Несуженный `on:` покрывает все ветки сразу, и
  # тогда каждое вливание в накопительную линию оплачивается полным прогоном —
  # то есть режим, заводимый ради экономии ранеров, экономии не даёт.
  #
  # `pull_request` при этом НЕ сужается по `paths`: защита ствола требует
  # контексты ПОИМЁННО, а контекст, который не начался, не зеленеет и не
  # краснеет — он остаётся «ожидается», и слияние блокируется навсегда.
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# СТАТУС НЕ ТЕРЯЕТСЯ В ТРУБЕ. Умолчание для `run:` — `bash -e {0}`, то есть БЕЗ
# pipefail: `<проверка> | tee` отдаёт шагу код ПРАВОЙ команды и зеленеет при
# любом провале левой. `shell: bash` включает `-eo pipefail`.
#
# `-e` при этом остаётся, и это связывает КАЖДЫЙ шаг ниже: ненулевой код
# обрывает шаг МОЛЧА, до любой развилки. Поэтому код возврата берётся как
# ДАННЫЕ (`cmd || rc=$?`), а вся логика, у которой есть развилка, вынесена в
# скрипты `.github/scripts/` — ветку внутри шага нечем доказать инъекцией.
defaults:
  run:
    shell: bash

jobs:
  # ── СБОРКА · VET · ФОРМАТ ────────────────────────────────────────────────────
  build:
    name: сборка · vet · gofmt
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: go mod download
        run: go mod download

      - name: сборка
        run: go build ./...

      - name: vet
        run: go vet ./...

      - name: gofmt
        run: |
          # Обход идёт по ИНДЕКСУ git, а не по диску: иначе в перепись попадут
          # игнорируемые каталоги и кэши сборки.
          #
          # ИСКЛЮЧЕНИЯ ДЛЯ СГЕНЕРЁННЫХ СТАБОВ ЗДЕСЬ НЕТ, И ЭТО ЗАМЕР. Стабы в
          # дереве ЕСТЬ (`git ls-files '*.pb.go' | wc -l` → 10, каталог `api/`),
          # но `gofmt -l` на них молчит: их форматирует генератор. Исключение
          # без предмета — то же послабление, которое не истечёт никогда;
          # разойдётся генератор с `gofmt` — шаг об этом скажет, и это будет
          # верный повод пересмотреть, а не тихая слепая зона.
          files=$(git ls-files '*.go')
          if [ -z "$files" ]; then
            echo "ОТКАЗ: обход пуст — ни одного файла Go не прочитано." >&2
            echo "«Ноль неотформатированных» здесь означало бы «ноль прочитанного»." >&2
            exit 1
          fi
          echo "прочитано файлов Go: $(printf '%s\n' "$files" | wc -l)"
          unformatted=$(gofmt -l $files || true)
          if [ -n "$unformatted" ]; then
            echo "требуется gofmt:"; echo "$unformatted"; exit 1
          fi
          echo "ЗЕЛЁНЫЙ: неотформатированных нет."

  # ── ЮНИТЫ ───────────────────────────────────────────────────────────────────
  unit:
    name: пробы -race -short (числовой вердикт)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod download

      # ПРОГОНЩИК ВЫНОСИТ ЧАСТЬ ВЕРДИКТА, значит его способность УПАСТЬ обязана
      # быть доказана ДО того, как его вердикту поверят: иначе он сам стал бы
      # формой без содержания — тем самым классом, ради которого заведён.
      - name: прогонщик вердикта способен упасть (самопроба инъекцией)
        run: python3 .github/scripts/go-test-verdict.py --self-test

      # `-short` ОБЯЗАТЕЛЕН: он и есть выключатель контейнеров. Без него сюда
      # затягиваются пробы, поднимающие Postgres (`pgtest` объявляет пропуск
      # ровно по `testing.Short()`), и задание упирается в предел времени.
      # Контейнерные гоняет отдельное задание ниже.
      #
      # Код `go test` берётся ДАННЫМИ: под `-e` ненулевой оборвал бы шаг до
      # прогонщика, и вердикта — числа исполненного, отказов и пропущенного —
      # не было бы вовсе. Роняет шаг ПРОГОНЩИК, а не `go test`.
      - name: пробы (-race -short)
        run: |
          rc=0
          go test ./... -race -short -count=1 -timeout 25m -json > test.json 2>&1 || rc=$?
          echo "go test завершился с кодом $rc (вердикт выносит прогонщик ниже)"
          python3 .github/scripts/go-test-verdict.py < test.json

  # ── ЛИНТ ────────────────────────────────────────────────────────────────────
  lint:
    name: golangci-lint (пин v2.12.2)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7
        with:
          go-version-file: go.mod
          cache: true

      # `go install`, а НЕ готовый бинарь действия: предсобранный собран чужим
      # toolchain'ом, и если он старше нашего `go.mod`, линтер отказывается
      # работать. Сборка нашим же toolchain'ом делает этот рассинхрон
      # невозможным. Версия запинена — с `@latest` новые правила прилетают сами
      # и роняют ствол без единой правки кода.
      - name: установка golangci-lint нашим toolchain'ом
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2

      - name: golangci-lint
        env:
          # Кэш линтера — В РАБОЧЕЙ КОПИИ этого задания. Умолчание общее на
          # машину, а запись в нём ключуется содержимым пакета, не деревом.
          GOLANGCI_LINT_CACHE: ${{ github.workspace }}/.cache/golangci-lint
        run: golangci-lint run --timeout=10m --config=.github/golangci.yml

  # ── СТАТИЧЕСКИЙ АНАЛИЗ БЕЗОПАСНОСТИ ──────────────────────────────────────────
  gosec:
    name: gosec (пин v2.28.0)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: установка gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@v2.28.0

      - name: гейт gosec способен упасть (самопроба инъекцией)
        run: .github/scripts/gosec-gate.sh --self-test

      # `-stdout -verbose text` — НЕ косметика: SARIF не несёт ПЕРЕПИСИ
      # осмотренного, а без переписи «ноль находок» неотличимо от «ноль
      # прочитанного». Сканер, не сумевший собрать дерево, пишет отчёт
      # ПОБАЙТОВО такой же, как у чистого дерева. Текстовая сводка отвечает на
      # оба вопроса: `Golang errors in file:` (дерево не загрузилось) и
      # `Files : N` (сколько прочитано).
      #
      # Флага `-tests` нет: пробы не поставляются потребителю, а харнесс по
      # своей природе делает ровно то, на что правила срабатывают. Включать его
      # молча нельзя — это мгновенно красный гейт, «починка» которого свелась бы
      # к массовым подавлениям.
      - name: прогон gosec
        run: |
          rc=0
          gosec -stdout -verbose text -fmt sarif -out gosec.sarif ./... \
            | tee gosec-summary.txt || rc=$?
          # Код возврата gosec вердиктом НЕ является: он ненулевой и при
          # находках ниже порога, то есть отвечает на другой вопрос.
          echo "gosec завершился с кодом $rc (вердикт выносит гейт ниже)"

      - name: гейт (level=error, с отличением несостоявшегося сканирования)
        run: .github/scripts/gosec-gate.sh gosec.sarif gosec-summary.txt

      # Отчёт сохраняется ВСЕГДА: на красном он и нужен. SARIF в раздел
      # безопасности НЕ выгружается намеренно — приём кода-сканирования зависит
      # от плана репозитория, и его отсутствие приходило бы отказом задания,
      # неотличимым от находки.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        if: always()
        with:
          name: gosec-report
          path: |
            gosec.sarif
            gosec-summary.txt
          if-no-files-found: warn

  # ── КОНТЕЙНЕРНЫЕ ПРОБЫ ──────────────────────────────────────────────────────
  integration:
    name: интеграция (Postgres в контейнерах)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod download

      - name: классификатор исхода способен упасть (самопроба инъекцией)
        run: .github/scripts/classify-integration-outcome.sh --self-test

      - name: контейнерные пробы
        env:
          # Уборщик контейнеров на ЭФЕМЕРНОМ исполнителе не нужен: машина
          # исчезает целиком вместе со всем, что на ней поднято. Зато его
          # собственный подъём — сетевой шаг, и его неудача роняет пробы, у
          # которых вердикта не было вовсе.
          TESTCONTAINERS_RYUK_DISABLED: "true"
          INTEGRATION_TIMEOUT: 30m
        run: |
          # ИСХОДОВ ТРИ, и шаг их различает. Код 75 — «условие не создано»:
          # Postgres не поднялся, вердикта нет НИ У ОДНОЙ пробы, включая
          # успевшие пройти. Красным это подавать нельзя — читатель идёт искать
          # дефект в коде, которого нет; зелёным тем более нельзя — не
          # исполнено ничего.
          #
          # ПРОИЗВОДИТЕЛЬ У КОДА 75 ЕСТЬ В ЭТОМ ДЕРЕВЕ: `pgtest` при
          # неподнявшемся контейнере сам выходит кодом 75 и печатает «integration
          # Postgres unavailable», объявляя в своём комментарии, что конвейер
          # обязан этот код различать. Здесь он и различается.
          rc=0
          .github/scripts/run-integration.sh || rc=$?
          if [ "$rc" -eq 75 ]; then
            echo "::error title=УСЛОВИЕ НЕ СОЗДАНО::Postgres для контейнерных проб не поднялся — прогон недействителен, это не дефект кода. Повторить после устранения причины."
            exit 1
          fi
          exit "$rc"

  # ── ИЗВЕСТНЫЕ УЯЗВИМОСТИ ────────────────────────────────────────────────────
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7
        with:
          go-version-file: go.mod
          cache: true
      # `@latest` — так объявлено в монорепо, и здесь повторено осознанно:
      # предмет этой проверки — база уязвимостей, которая обновляется
      # НЕЗАВИСИМО от версии инструмента, поэтому пин версии её свежести всё
      # равно не даёт. Цена названа: вердикт может измениться без правки дерева
      # — но изменится он от появления уязвимости, то есть ровно от того, ради
      # чего проверка и стоит.
      - name: установка govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: govulncheck
        run: govulncheck ./...
