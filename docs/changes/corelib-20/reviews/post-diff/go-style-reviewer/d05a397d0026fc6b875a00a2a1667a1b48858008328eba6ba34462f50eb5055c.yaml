premise_checks:
  - claim: 'ленивых писателей в настройках движка ровно четыре'
    result: подтверждено
    how: >-
      grep по internal/oauth2/config_default.go: 47 методов *Config, ветки
      `== nil` у семи геттеров, из них пишут в поле четыре (GetSecretsHasher,
      GetScopeStrategy, GetAudienceStrategy, GetJWKSFetcherStrategy);
      GetHTTPClient, GetRedirectSecureChecker, GetRefreshTokenScopes
      возвращают умолчание без записи. Число полей Config — 47, независимо от
      пробы (совпадение «методов 47 · полей 47» в выводе пробы настоящее).
  - claim: 'путь запроса церемонии не достигает GetJWKSFetcherStrategy'
    result: подтверждено
    how: >-
      оба вызова — в findClientPublicJWK (client_authentication.go), куда
      приходят только через приведение к OpenIDConnectClient;
      clientViewOf всегда возвращает *clientView, так что предикат
      исключения на нулевой регистрации судит единственный тип.
  - claim: 'проба переписи краснеет без -race, одновременная — только под -race'
    result: подтверждено опытом
    how: >-
      в копии снята строка `engineCfg.ClientSecretsHasher = ...`:
      TestEngineSettingsBuiltByNewAreOnlyReadOnTheRequestPath — FAIL с
      координатой «GetSecretsHasher → ClientSecretsHasher»;
      TestConcurrentExchangesOnAFreshCeremonyShareNoEngineState без детектора
      — PASS, ровно как сказано в её шапке. Строка возвращена
      (`git checkout`), дерево копии чистое.
  - claim: 'проба записи из хранилища ловит нулевой срок'
    result: подтверждено опытом
    how: >-
      в копии снята проверка checkStoredInstants для ExpiresAt:
      TestStoredZeroInstantIsAContractBreach/SessionRecord.ExpiresAt — FAIL
      («запись … принята: оборот прошёл»), близнец и подслучай NotAfter —
      PASS. Возвращено.
  - claim: 'сеанс — единственный писатель срока'
    result: подтверждено
    how: >-
      в internal/oauth2 (без проб и integration) карту ExpiresAt сеанса
      пишут только SetExpiresAt у DefaultSession; ceremonySession
      перехватывает этот метод, hydrateSession кладёт сроки через него же.
  - claim: 'PROVENANCE: «прочитано 762 из 762, находок 1»'
    result: вывод подтверждён, число — нет (см. important I3)
    how: >-
      treehygiene.AuditDeferredWork(корень копии на дереве f6dead5d8211, без вычитаний):
      в индексе 765, прочитано 765, находок 1 —
      internal/oauth2/handler/oauth2/introspector_jwt.go:78, маркер апстрима.

critical: []

important:
  - id: I1
    tag: DOC-PREDICATE-SCOPE
    at: oauthceremony/ceremony.go:109
    summary: >-
      шапка Ceremony говорит «движок и настройки после сборки только
      читаются» и называет предикатом TestEngineSettingsBuiltByNewAreOnlyReadOnTheRequestPath,
      а проба судит только методы *engine.Config. Половину про движок
      (обработчики, стратегия HMAC) она не осматривает. Утверждение
      верно: стратегия HMAC держит мьютекс, у Fosite ленивых полей нет. Но
      предикат приписан шире своего предмета.
    requirement: >-
      сузить скобку до «настройки (предикат — …)» либо назвать, чем держится
      половина о движке.
  - id: I2
    tag: TWO-PLACES-ONE-SUBJECT
    at: 'oauthceremony/ceremony.go:613 · oauthceremony/translate.go:507'
    summary: >-
      checkGrantBounds и checkStoredInstants — один и тот же обход «первый
      нулевой вид по порядку имени», различаются только конструктором
      отказа. Правило «ноль — не граница» живёт в двух местах, и порядок
      обхода или предикат нуля разъедутся на первой правке одного из них.
    requirement: >-
      вынести общий помощник (например firstZeroKind(map[TokenKind]time.Time)
      (TokenKind, bool)) и звать его из обоих мест, отказы оставить разными.
  - id: I3
    tag: NUMBER-WITHOUT-REVISION
    at: internal/oauth2/PROVENANCE.md:377
    summary: >-
      «прочитано 762 из 762 файлов индекса» не называет ревизии. 762 — индекс
      деревьев 790f829d573b/f68caa8c590b, а текст внесён коммитом с деревом b25cc9f848f1, где файлов 763; на голове
      (дерево f6dead5d8211) их 765 (`git ls-tree -r --name-only <rev> | wc -l`). Вывод
      («находка одна, и это маркер апстрима») на голове верен — перемерено.
    requirement: >-
      назвать ревизию замера либо переснять на ревизии, которая несёт текст.

