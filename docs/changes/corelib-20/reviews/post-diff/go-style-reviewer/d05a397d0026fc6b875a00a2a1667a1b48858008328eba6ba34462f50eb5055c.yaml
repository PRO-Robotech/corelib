style:
  - id: S1
    at: oauthceremony/engineconfig_internal_test.go:11
    summary: >-
      в шапке пробы координата дана номерами строк
      (`config_default.go:261` / `:262`). Сейчас они верны, но уедут при
      первой правке заголовка файла поддерева. PROVENANCE.md этой же дельты
      прямо говорит, что координата — файл и метод, а не номер строки.
      Раскрытием это не считаю: дефект закрыт в том же дереве и до main не
      доехал.
    requirement: 'оставить имя метода GetSecretsHasher, номера строк снять'
  - id: S2
    at: oauthceremony/lifetime_test.go:209
    summary: >-
      TestGSR_ZeroRefreshBound — префикс-аббревиатура без референта
      (`git grep GSR` в corelib находит только эту пробу; в воркспейсе
      docs/.claude — ноль). Соседи по файлу названы по предмету.
    requirement: 'назвать по предмету, в форме соседей'
  - id: S3
    at: oauthceremony/engineconfig_internal_test.go:70
    summary: >-
      перепись вызывает отражением КАЖДЫЙ геттер, в том числе
      GetJWKSFetcherStrategy, на обеих настройках (собранных New и пустых).
      NewDefaultJWKSFetcherStrategy заводит кеш ristretto с фоновыми
      исполнителями, а метода остановки у стратегии нет. Проба сама
      запускает то, ради незапуска чего заведено исключение offRequestPath;
      исполнители живут до конца бинаря проб. Стража утечки горутин в
      пакете нет, так что это не красное.
    requirement: 'назвать это в шапке переписи (цена обхода «каждый метод»)'

