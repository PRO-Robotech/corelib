experiment:
  why: >-
    Шапка пробы (engineconfig_static_internal_test.go:38-46) и сообщение коммита
    утверждают: «Форму, которую без типов не судить, называет неразобранной и
    краснеет, а не молчит». Утверждение проверено ЭКСПЕРИМЕНТОМ, не чтением.
  where: >-
    Отдельный linked worktree на той же голове
    (detached, дерево af4973d50b39), файл-эксперимент oauthceremony/zz_gsr_probe_internal_test.go
    на СОБСТВЕННОЙ обвязке пробы (injection.apply → engineCopy → walkEngineSource,
    с её положительным контролем глубины 1). Копия ревью не тронута.
  command: >-
    TMPDIR=<worktree>/.gsr-tmp go test -count=1 -v -run
    'TestEngineSettingsMethodsWriteNoFieldContent|TestSourceAndReflectiveCensusesNameTheSameLazyWrites|TestEmptySourceWalkIsNotAVerdict|TestContentWriteInjectionIsFoundWithItsCoordinate|TestUnjudgedFormInjectionIsRedNotSilent|TestLawfulTwinOfAContentWriteIsSilent|TestEngineSettingsBuiltByNewAreOnlyReadOnTheRequestPath|TestReplacedFieldFindingTextKeepsNamingInNewToLazyFill|TestGSRProbeSilentForms'
    ./oauthceremony/
  outcome_raw: >-
    Код 1. PASS 44 (все пробы диффа и их подпробы), FAIL 7 = 1 родитель + 6
    подслучаев эксперимента; контрольный подслучай эксперимента (форма, которую
    шапка НАЗЫВАЕТ неразобранной: `mutateInjected(c.InjectedMap)`) — красный,
    т.е. обвязка эксперимента работает. Перепись живого дерева:
    файлов 43 · методов типа настроек 47 · обращений к приёмнику 70 · записей 4
    (глубина 1) · глубже поля 0 · неразобранных 0; в копиях эксперимента
    файлов 44 — инъекция легла.
  silent_forms:   # находок 0 · неразобранных 0 — молчание
    - form: 'значение-метод НАСТРОЕК, вызов результата по индексу'
      src: "f := c.GetSanitationWhiteList\nf(ctx)[0] = \"x\""
      mechanism: 'root() :478-481 — `c.M` для метода настроек возвращает «не содержимое», хотя значение-метод несёт приёмник'
    - form: 'значение-метод настроек аргументом функции'
      src: "runGetter(c.pairMap)   // func runGetter(f func() map[string]string) { f()[\"k\"] = \"v\" }"
      mechanism: 'тот же root() :478-481 → passesContent :618-625 отвечает «нет»'
    - form: 'второй результат метода настроек'
      src: "_, m := c.pair()\nm[\"k\"] = \"v\""
      mechanism: 'collectAliases :563-565 и :571-573 — при n:1 связывается только Lhs[0]/Names[0]'
    - form: 'замыкание отдаёт содержимое'
      src: "get := func() map[string]string { return c.InjectedMap }\nget()[\"k\"] = \"v\""
      mechanism: 'root() :466-517 не знает *ast.FuncLit; judgeCall на get() — contentArgsUnjudged по аргументам, их нет'
    - form: 'локальный составной литерал в том же методе'
      src: "s := struct{ m map[string]string }{c.InjectedMap}\ns.m[\"k\"] = \"v\""
      mechanism: 'root() :466-517 не знает *ast.CompositeLit — bind не связывает s'
    - form: 'содержимое в литерале аргументом функции'
      src: "mutateWrapped([]map[string]string{c.InjectedMap})"
      mechanism: 'passesContent :618-625 → root(CompositeLit) = «нет»; та же передача без литерала — неразобранная (контроль красный)'

findings:
  critical:
    - id: C1
      tag: '[DOC-TRUTH / RECOGNIZER-SILENT-FORM]'
      at:
        - oauthceremony/engineconfig_static_internal_test.go:38-46
        - oauthceremony/engineconfig_static_internal_test.go:52-55
        - oauthceremony/engineconfig_static_internal_test.go:478-481
        - oauthceremony/engineconfig_static_internal_test.go:563-565
        - oauthceremony/engineconfig_static_internal_test.go:571-573
        - oauthceremony/engineconfig_static_internal_test.go:618-625
        - oauthceremony/ceremony.go:109-124
      claim: >-
        Шапка пробы обещает закрытость: чего разбор без типов судить не умеет,
        он «не пропускает, а называет НЕРАЗОБРАННЫМ». Эксперимент нашёл ШЕСТЬ
        форм записи в содержимое настроек из метода engine.Config, на которых
        проба молчит (experiment.silent_forms). Четыре из них (значение-метод
        настроек ×2, второй результат, замыкание) шапка не называет вовсе; две
        (составной литерал) подпадают под слова слепой зоны :52-55, но её
        обоснование «это чужой код, а не метод настроек» для локального
        литерала ложно — пишет сам метод настроек. Doc-комментарий Ceremony
        (не-тестовый файл, ceremony.go:109-124) повторяет обещание, перечисляя
        «чего не судит ни одна из них», и этих форм не называет. Это класс
        recognizer-knows-all-lawful-forms (testing.md) и arch-doc-truthfulness
        на утверждении о безопасности одновременного использования движка
        OAuth — запрет роли «комментарий о защите, противоречащий коду».
      requirement: >-
        Одно из двух, по каждой из шести форм. (а) Предпочтительно — по
        собственному принципу шапки «цена упрощения — лишнее красное, а не
        молчание»: научить разбор, чтобы форма давала находку либо
        неразобранную форму — значение-метод настроек вне позиции вызова;
        все Lhs/Names при n:1 из корня-содержимого; *ast.FuncLit и
        *ast.CompositeLit, несущие корень, в root()/passesContent. Каждая форма
        — инъекцией в TestContentWriteInjectionIsFoundWithItsCoordinate либо
        TestUnjudgedFormInjectionIsRedNotSilent, с законным близнецом той же
        формы в TestLawfulTwinOfAContentWriteIsSilent. (б) Либо назвать форму
        слепой зоной ЧЕСТНО — в шапке :52-55 без «чужого кода» для локального
        случая и в перечне «Чего не судит ни одна из них» ceremony.go:119-121.
        Смешанный исход допустим; молчащей формы без имени — нет.
      return_to: 'автор диффа — полоса corelib ветки 20 (коммит с деревом af4973d50b39, pointpu)'
      predicate_of_closure: >-
        Шесть src из experiment.silent_forms, вставленные той же обвязкой
        injection.apply, дают каждая ≥1 находку или ≥1 неразобранную форму —
        либо каждая названа в шапке и в ceremony.go поимённо.
  important: []
  foundation_candidates: []   # дифф — сама corelib; горизонтального дубля фундамента нет
  style:
    - id: S1
      at: oauthceremony/engineconfig_static_internal_test.go:455-463
      what: 'Локальный unparen дублирует stdlib `ast.Unparen` (go/ast, есть в go1.26.8 — `go doc go/ast.Unparen`). Заменить импортом.'
    - id: S2
      at: oauthceremony/engineconfig_static_internal_test.go:18-19
      what: >-
        «читает те файлы, которые компилятор собирает в пакет движка: все
        не-тестовые .go каталога» — не тождество: ограничения сборки
        (//go:build, суффиксы GOOS/GOARCH) не учитываются. Сегодня в
        internal/oauth2 таких файлов 0 (`grep -l '^//go:build' internal/oauth2/*.go`
        — пусто), и разбор читает НАДМНОЖЕСТВО (сдвиг в красное через
        requireSameTypeAsCompiled), но слова утверждают равенство. Сказать
        «надмножество» либо отбирать go/build.Context.MatchFile.
    - id: S3
      at: 'oauthceremony/engineconfig_static_internal_test.go:199, :823-824'
      what: 'sort.Ints / sort.Strings рядом с slices.* в том же файле — одна идиома: slices.Sort.'
    - id: S4
      at: 'oauthceremony/engineconfig_static_internal_test.go:924, :957, :966, :259, :1000'
      what: >-
        Имена уровня пакета общего вида (marker, writeFile, replaceOnce,
        origin, injection) в пространстве внутренних проб пакета oauthceremony
        — следующий внутренний тест пакета столкнётся по имени. Нестрого.
    - id: S5
      at: oauthceremony/engineconfig_static_internal_test.go:781-787
      what: >-
        Ручной разбор строки `module` go.mod (`len(Fields)==2`): форма
        `module path // комментарий` уронит пробу в ПРЕДПОСЫЛКУ (fail-closed,
        не молчание). Допустимо; отмечено.
  approved:
    - 'Ошибки обхода обёрнуты `fmt.Errorf(... %w)` с содержательным контекстом (walkEngineSource :284-299).'
    - 'Паники нет; t.Helper на всех вспомогательных; t.Fatalf на НЕ ВЫПОЛНИЛОСЬ/ПРЕДПОСЫЛКА отделены от находок t.Error.'
    - 'Перепись печатается отдельно от находок, пустой обход — не вердикт (emptyWalk + TestEmptySourceWalkIsNotAVerdict).'
    - 'Предпосылка проверяется: поля и экспортированные методы по разбору = отражению собранного типа; глубина 1 сверена с переписью отражением (два независимых прибора).'
    - 'Инъекции в копии поддерева с законными близнецами; красное атрибутировано ровно одной находке на копию; текст находки утверждается (finding-text-is-part-of-property).'
    - 'maxAliasDepth и формы записи — именованные константы; магических чисел нет.'
    - 'gofmt -l oauthceremony/ — пусто; go vet ./oauthceremony/ — код 0 (замерено как вход находок, исход линтера этой ролью не объявляется).'
    - 'Правка не-тестового файла — только doc-комментарий (ceremony.go); поведения не меняет.'

