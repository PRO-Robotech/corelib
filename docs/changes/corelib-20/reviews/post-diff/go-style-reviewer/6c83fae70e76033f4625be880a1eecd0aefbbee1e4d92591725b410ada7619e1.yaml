        поэтому не блокирует.
      requirement: 'Внести в blindZoneForms (с именем в шапке и в ceremony.go) либо научить root/judgeCall: не-первый аргумент append/copy, несущий содержимое, — неразобранная форма.'
    - id: I2
      at: ['oauthceremony/ceremony.go:123-131']
      what: >-
        «Всё это держит только -race проба» неверно для записи того же значения:
        инъекция `c.HashCost = max(c.HashCost, 0)` в метод настроек живого дерева
        роняет TestSourceAndReflectiveCensusesNameTheSameLazyWrites («приборы
        разошлись»). Комментарий занижает покрытие (безопасное направление), но
        это комментарий о защите, не совпадающий с кодом.
      requirement: 'Сказать, что запись того же значения в формах разбора держит сверка приборов, если на пустых настройках метод это поле не меняет; иначе — только -race.'
    - id: I3
      at: ['oauthceremony/engineconfig_static_internal_test.go:573']
      what: >-
        literalRoot связывает литерал с глубиной содержимого, а не на шаг выше:
        законный `s := T{m: c.F}; s.m = nil` (пишет локальный) даёт находку
        глубины 2 с текстом «назвать поле в New её НЕ снимает». Лишнее красное,
        не молчание; близнеца этой формы нет.
      requirement: 'Сдвигать глубину литерала на −1 для его частей либо добавить близнец и назвать цену в шапке.'
