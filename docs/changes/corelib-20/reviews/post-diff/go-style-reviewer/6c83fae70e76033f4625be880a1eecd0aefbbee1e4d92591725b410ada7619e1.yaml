    - {form: '(1) f := c.GetSanitationWhiteList; f(ctx)[0]', result: 'неразобранная 1', held_by: 'TestUnjudgedFormInjectionIsRedNotSilent «значение-метод настроек, вызванное через переменную»; близнец «метод настроек вызван, а не взят значением»'}
    - {form: '(2) runGetter(c.pairMap)', result: 'неразобранная 1', held_by: 'TestUnjudgedFormInjectionIsRedNotSilent «значение-метод настроек аргументом»'}
    - {form: '(3) _, m := c.pair(); m[k]', result: 'находка 1 (глубина 2)', held_by: 'TestContentWriteInjectionIsFoundWithItsCoordinate «второй результат…» (:= и var); близнец «…только читается»'}
    - {form: '(4) замыкание отдаёт содержимое', result: 'молчание — названо', held_by: 'blindZoneForms «замыкание, отдающее содержимое»; шапка :68-69, ceremony.go:125-126; TestNamedBlindZoneFormsStaySilent'}
    - {form: '(5) локальный составной литерал', result: 'находка 1 (глубина 3)', held_by: 'TestContentWriteInjection… «локальный составной литерал» (+с ключом, под &); близнецы «копии поля-значения», «только читается»'}
    - {form: '(6) mutateWrapped([]map{c.InjectedMap})', result: 'неразобранная 1', held_by: 'TestUnjudgedFormInjection… «составной литерал аргументом функции»; близнец «литерал копий полей-значений аргументом»'}
