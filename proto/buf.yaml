# buf.yaml — объявление модуля контрактов ФУНДАМЕНТА.
#
# ЗАЧЕМ ОН ПОЯВИЛСЯ. До этого изменения у фундамента не было дома контрактов ни
# одним файлом: `.proto` — 0, `buf.yaml` — 0, `buf.gen.yaml` — 0, шагов
# генерации в конвейере — 0, при ДВЕНАДЦАТИ закоммиченных заглушках в `api/`.
# То есть вход жил в дереве платформы, производное — здесь, и рецепт порождения
# существовал только в сообщении коммита. Сверить их между собой было нечем: ни
# одна команда этого дерева не умела спросить «сходится ли заглушка со своим
# контрактом».
#
# ЧЕМ ЭТО ХУЖЕ ОБЫЧНОГО ДУБЛИРОВАНИЯ. Расхождение входа и производного здесь не
# наступает громко — оно наступает МОЛЧА: каждое дерево по отдельности исправно,
# сборка проходит, пробы зелены. Заметить нечем, пока потребитель не получит
# заглушку, описывающую не тот контракт.
#
# НАБОР ПРАВИЛ ВЗЯТ У ДВУХ СОСЕДЕЙ ДОСЛОВНО, и это не копирование по инерции:
# те же контракты судились этим набором до переезда, и смена набора вместе с
# переездом дала бы находки, неотличимые от находок переезда.
version: v2
modules:
  - path: .
lint:
  use:
    - STANDARD
  except:
    - PACKAGE_VERSION_SUFFIX
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME
    - RPC_REQUEST_RESPONSE_UNIQUE
    - ENUM_VALUE_PREFIX
    - ENUM_ZERO_VALUE_SUFFIX
  ignore:
    - google
breaking:
  use:
    - FILE
  ignore:
    - google
