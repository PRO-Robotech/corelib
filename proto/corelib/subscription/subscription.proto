syntax = "proto3";

package corelib.subscription;

import "google/protobuf/any.proto";

option go_package = "github.com/PRO-Robotech/corelib/api/corelib/subscription;subscriptionv1";

// Единая форма подписки на изменения ресурсов.
//
// Здесь объявлены ЧЕТЫРЕ типа и ни одного `service`: запрос подписки, служебное
// первое сообщение потока, оболочка события и перечислитель начала.
//
// # Почему глагол лежит в СОСЕДНЕМ файле, а не здесь
//
// Этот файл обязан импортироваться КЕМ УГОДНО. Глагол несёт аннотации каталога
// прав, то есть тянет за собой контракт другого домена; лежи он здесь, форма
// перестала бы быть общей — домен, у которого этой зависимости нет, взять её не
// смог бы, и рядом появилась бы вторая.
//
// Поэтому: форма — здесь, глагол платформы и носитель его потока —
// `subscription_service.proto` того же пакета. Разделение держит гейт дерева
// (`internal/repohygiene/subscriptionformshape.go`), а не эта фраза.
//
// Форма утверждена фазой kacho#1017 отдельно от глагола и намеренно: под
// объявление, которое ещё могут поправить, сервер не пишут. Глагол и сервер
// (`corelib/subscription`) заведены фазой kacho#1018, когда форма уже стояла.
//
// # Один язык подписки на всех владельцев
//
// Домены эту форму ИМПОРТИРУЮТ, а не переобъявляют. Второй язык фильтров
// заводится не злым умыслом: домену нужна подписка, общая форма чем-то не
// подошла, и рядом появляется своя — со своим набором осей, своей позицией и
// своим смыслом пустого поля. Через семь доменов их семь, и «единая подписка»
// остаётся названием. Единственность держит гейт дерева
// (`internal/repohygiene/subscriptionformsingularity.go`), а не эта фраза.
//
// Единой объявляется ФОРМА ПОДПИСКИ, а не форма события: полезная нагрузка
// специфична для владельца и общей не делается — унификация, взявшая шире,
// потребовала бы от семи доменов одинакового состояния ресурса, которого у них
// нет.
//
// # Направление: подписку открывает ПОТРЕБИТЕЛЬ к ВЛАДЕЛЬЦУ
//
// Соединение открывает тот, кому нужны события; владелец журнала о подписчиках
// не знает и никому не звонит. Это единственное направление, при котором лист
// остаётся листом: обратное — владелец звонит потребителю — заводит ребро из
// листа наружу и замыкает граф вызовов.
//
// # Подписка НЕ заменяет полл операции
//
// Мутация по-прежнему возвращает `Operation`, и её исход узнаётся поллом.
// Подписки на операции не заводится, и одного потока ресурсов для этого
// НЕДОСТАТОЧНО: событие пишется в той же транзакции, что и ресурсная строка,
// поэтому при отказе операции события нет ВОВСЕ — наблюдатель ресурсов не
// отличит «ещё делается» от «упало».

// SubscriptionAnchor — якорь начала, когда клиент называет его словом, а не
// позицией.
enum SubscriptionAnchor {
  // Не назван. В ветви `SubscriptionRequest.start` отвергается
  // `INVALID_ARGUMENT`: выбрав ветвь якоря, вызывающий обязан назвать якорь.
  // Умолчание живёт у НЕЗАДАННОЙ ветви, а не у незаданного значения внутри
  // выбранной — иначе одно и то же намерение выражалось бы двумя способами.
  SUBSCRIPTION_ANCHOR_UNSPECIFIED = 0;

  // С начала журнала — всё, что владелец ещё удерживает.
  BEGINNING = 1;

  // С текущего конца — только то, что записано после открытия подписки.
  CURRENT_END = 2;
}

// SubscriptionRequest — запрос подписки: чем сузить поток и с какого места его
// начать.
//
// # Оси фильтра: три, все необязательны, соединяются конъюнкцией
//
// Заданные оси сужают ВМЕСТЕ: событие приходит, только если удовлетворяет всем
// заданным сразу. Незаданная ось не сужает ничем — и это её ЕДИНСТВЕННОЕ
// значение: подписка без единой оси даёт то же, что подписка, где каждая ось
// перечислила все свои значения (в пределах прав вызывающего).
//
// У каждой оси проставлен ПРИЗНАК КАТЕГОРИИ — «якорная» либо «удобства», — и
// различие не косметическое. По якорной оси принимается решение о показе;
// исхода «ось названа, но не применена» у неё НЕ СУЩЕСТВУЕТ (см.
// `SubscriptionOpened.honored_filters`). По оси удобства доотбор на клиенте
// законен: он получит лишнее и отбросит.
//
// # Имени ресурса и меток здесь НЕТ, и вот почему
//
// ИМЯ — мутабельный косметический ярлык, а адресуется ресурс неизменяемым `id`.
// Подписка по имени МОЛЧА перестаёт совпадать после переименования: ни события,
// ни ошибки, ни следа — поток просто замолкает навсегда. Адресный отбор делает
// ось `ids`.
//
// МЕТКИ мутабельны, и ресурс входит в выборку и выходит из неё по их правке. Без
// предыдущего состояния выход из выборки неотличим от удаления ресурса, то есть
// подписчик принял бы правку метки за снос. Отбор по меткам делает КЛИЕНТ.
//
// ЦЕНА ЭТОГО РЕШЕНИЯ НАЗВАНА, а не подразумевается: клиент отбирает по меткам
// ровно там, где событие принесло состояние. Владелец, чей журнал состояния НЕ
// ПРОИЗВОДИТ, источника для такого отбора не даёт — по его видам отбор по меткам
// НЕИСПОЛНИМ, и подписчик, которому метки нужны, читает предмет по
// `resource_id`. Это не пропуск и не временное состояние: производит владелец
// состояние или нет, объявляется в потоке — причиной
// `SubscriptionEvent.StateUnavailable.NOT_PRODUCED`, отличимой машинно от сбоя
// сборки. Соврать здесь было бы дороже отказа: подписчик, поверивший обещанию,
// молча отобрал бы по меткам, которых не получал.
//
// Отсутствие этих полей — решение, а не пропуск. Поле без записанной причины
// отсутствия заводит следующий «для удобства», и он будет прав по-своему.
message SubscriptionRequest {
  // kinds — виды предметов, о которых слать события. Категория: УДОБСТВА.
  //
  // Словарь видов принадлежит ВЛАДЕЛЬЦУ и им закрыт; фиксированного перечня
  // «ресурсы такого-то домена» здесь нет — иначе владелец, чьи события не про
  // ресурс, а про субъект прав, в эту форму не поместился бы вовсе.
  //
  // ГДЕ ЕГО ПРОЧИТАТЬ: `SubscriptionOpened.known_kinds` — служебное сообщение
  // открытия несёт словарь целиком и приходит первым. Подписка, не назвавшая ни
  // одного вида, законна и отказа не даёт, поэтому словарь читается ОДНИМ
  // открытием, а не перебором против отказа.
  //
  // # НАПИСАНИЕ ВИДА ОДНО НА ВСЁ ДЕРЕВО: это ТИП ОБЪЕКТА МОДЕЛИ ПРАВ
  //
  // Вид называется тем же словом, каким этот предмет зовёт модель прав
  // (`compute_instance`, `nlb_network_load_balancer`) — тем самым, что стоит в
  // `scope_extractor.object_type` контрактов домена. Слово НЕ придумывается
  // подпиской и не берётся из хранилища владельца: как строка журнала записана,
  // есть частное дело владельца, и наружу это не выходит.
  //
  // Причина ровно одна и она про клиента: словарь, у которого нет единственного
  // производителя, пишется столькими способами, сколько у него авторов, и
  // клиент, взявший написание у одного, не может знать, то ли оно. Здесь
  // производитель один — тот же, которым сервер решает вопрос о видимости
  // строки, — поэтому второго написания не существует by construction, а не по
  // договорённости.
  //
  // Форма слова: строчные латинские буквы, цифры и подчёркивание, первый знак —
  // буква. Владелец, объявивший вид иначе, НЕ ПОДНИМАЕТСЯ.
  //
  // Вид вне словаря владельца — `INVALID_ARGUMENT` с именем поля, названным
  // значением И перечнем известных видов, а НЕ открытый поток, в который никогда
  // ничего не придёт. Пустой поток есть утверждение «событий нет», которого
  // сервер не вправе делать про вход, которого он не понял; отказ, не называющий
  // годных значений, оставляет вызывающего ровно там, откуда он пришёл.
  repeated string kinds = 1;

  // project_id — проект, к которому относятся события. Категория: ЯКОРНАЯ.
  //
  // По ней принимается решение о показе, поэтому владелец, не умеющий отобрать
  // по ней, ОТВЕРГАЕТ подписку, а не открывает её с оговоркой: «доотбор на
  // клиенте» означало бы, что границу доступа держит клиент.
  //
  // Незаданная ось проектом не сужает. Событие, не принадлежащее проекту вовсе
  // (предмет уровня аккаунта или кластера), выразимо — см.
  // `SubscriptionEvent.project_id`.
  string project_id = 2;

  // ids — неизменяемые идентификаторы предметов. Категория: УДОБСТВА.
  //
  // Это единственная ось, принимающая произвольную строку, и потому единственный
  // путь протащить мутабельную адресацию через иммутабельную. Имя ресурса,
  // поданное сюда, обязано быть отвергнуто `INVALID_ARGUMENT` — иначе подписка
  // откроется и замолчит навсегда, потому что имени не отвечает ни один
  // идентификатор.
  //
  // Идентификатор правильной формы, которому не отвечает ни один предмет, —
  // НЕ отказ: подписка открывается и просто не приносит по нему событий.
  // «Негодная форма» и «такого нет» — разные полосы, и подписка их не смешивает.
  repeated string ids = 3;

  // start — с какого места отдавать. Состояний ТРИ, и они различимы:
  // «с начала журнала», «с этой позиции», «с текущего конца».
  //
  // ИСХОД НЕЗАДАННОГО НАЗВАН, а не подразумевается: `start` не задан означает
  // ровно `CURRENT_END` — подписка на то, что произойдёт дальше. Выбор
  // осознанный: молчаливая полная выдача журнала («с начала») превращает
  // подписку в выгрузку и тем дороже, чем дольше журнал не чистили, а узнать об
  // этом вызывающий может только по счёту за неё.
  oneof start {
    // anchor — назвать место словом.
    SubscriptionAnchor anchor = 10;

    // position — НЕПРОЗРАЧНЫЙ ТОКЕН, выданный сервером, и ничего больше.
    //
    // Клиент хранит его и возвращает ДОСЛОВНО: не разбирает, не сравнивает два
    // токена между собой и не конструирует свой. Позиция, сконструированная или
    // изменённая клиентом, отвергается `INVALID_ARGUMENT` — а не принимается
    // «как похожая».
    //
    // ОБЯЗАТЕЛЬСТВО, РАДИ КОТОРОГО ПОЗИЦИЯ НЕПРОЗРАЧНА:
    //
    //   позиция, выданная сервером, обязана быть такой, что возобновление с неё
    //   не пропускает ни одной строки, закоммиченной ПОСЛЕ её выдачи.
    //
    // Оно записано здесь дословно, потому что непрозрачность его НЕ ОБЕСПЕЧИВАЕТ.
    // Непрозрачность покупает право починить внутреннюю форму позже, не ломая
    // контракт; она не чинит. Токен, кодирующий границу по МАКСИМУМУ ВИДИМОГО
    // номера, непрозрачен и всё равно теряет строку: номер присваивается на
    // вставке, видимость наступает на фиксации, поэтому писатель, закоммитивший
    // позже с меньшим номером, оказывается за границей — навсегда, молча и без
    // пропуска в нумерации, видимого клиенту. Скалярная граница законна;
    // граница по максимуму видимого — нет.
    //
    // Кодек позиции живёт там же, где объявлены прочие формы курсора этого
    // дерева, — в пакете `corelib/pagetoken`, и объявляется СВОИМ типом. Уже
    // объявленный там `Cursor` для неё НЕ ГОДИТСЯ: его семантика — «последняя
    // ОТДАННАЯ строка», а это дословно та граница, которую обязательство выше и
    // запрещает.
    //
    // Позиция принадлежит КЛИЕНТУ, а не подписке: сервер её не помнит и остаётся
    // stateless. Иначе возобновление привязывается к реплике, на которой
    // подписка была открыта, и переподключение к другой перестаёт работать.
    string position = 11;
  }
}

// SubscriptionOpened — служебное сообщение, которое приходит ПЕРВЫМ и всегда.
//
// Оно приходит и тогда, когда событий нет вовсе: поток остаётся открытым, а
// клиент уже знает, с чего сервер начал и что именно он для него сделал. Только
// после него идут события.
//
// Тип, а не соглашение о порядке: соглашение нельзя ни импортировать, ни
// проверить, а всё, что сервер обязан сказать о принятой подписке, держится
// ровно на нём.
message SubscriptionOpened {
  // position — позиция, с которой сервер начал отдавать. Непрозрачна ровно так
  // же, как `SubscriptionRequest.position`, и возвращается в неё дословно.
  string position = 1;

  // caught_up — исчерпан ли журнал на момент открытия.
  //
  // Этим «событий не было» отличается от «я подключился позже», и отличается ПО
  // СЛОВУ СЕРВЕРА, а не арифметикой клиента: над непрозрачным токеном сравнение
  // двух позиций невыразимо by construction, и непрозрачность именно этот ход и
  // запрещает.
  //
  // `true` + молчание = изменений не было. `false` + молчание = я ещё догоняю.
  bool caught_up = 2;

  // honored_filters — оси, которые этот владелец отобрал ЧЕСТНО.
  //
  // Значения — ИМЕНА ПОЛЕЙ `SubscriptionRequest`, как они объявлены в этом
  // контракте: `kinds`, `project_id`, `ids`. Имя поля контракта и есть провод,
  // поэтому свой второй словарь осей здесь не заводится — он разошёлся бы с
  // полями молча.
  //
  // Зачем перечень. Журналы владельцев устроены по-разному, и ось, выразимая
  // контрактом, не у каждого отбираема. Исходов у такой оси три: молча
  // проигнорировать — ЗАПРЕЩЕНО (вызывающий получит успех и решит, что его
  // параметр применён); отвергнуть — лишает подписки половину владельцев;
  // НАЗВАТЬ — то, что выбрано здесь. Цена названа: по неотобранной оси клиент
  // доотбирает сам.
  //
  // Исключение — ЯКОРНАЯ ось: её в этом перечне не бывает отсутствующей при
  // заданном значении, потому что владелец, не умеющий по ней отобрать,
  // подписку отвергает. Решение о показе не перекладывается на клиента.
  //
  // Владелец, отобравший все заданные оси, перечисляет их все, и перечень
  // совпадает с заданными вызывающим.
  repeated string honored_filters = 3;

  // earliest_resumable_position — самая ранняя позиция, с которой возобновление
  // ещё возможно.
  //
  // Владелец, переставший удерживать часть журнала, обязан уметь сказать
  // «твоя позиция больше не возобновима» ЯВНО и назвать место, с которого
  // подписка возможна, — а не начать молча с ближайшего удержанного. Молчаливое
  // начало клиент запишет как «изменений не было», и дописать этот исход потом
  // будет ломающим изменением.
  //
  // Отказ на невозобновимой позиции называет ЭТУ ЖЕ величину, поэтому она
  // объявлена одним полем, а не двумя похожими в двух местах.
  string earliest_resumable_position = 4;

  // retains_everything — владелец удерживает журнал целиком.
  //
  // Тогда отказ «позиция утрачена» не наступает никогда, и это СВОЙСТВО
  // ВЛАДЕЛЬЦА, объявленное им, а не умолчание формы: при `true` поле
  // `earliest_resumable_position` не несёт горизонта, потому что горизонта нет.
  bool retains_everything = 5;

  // known_kinds — ЗАКРЫТЫЙ СЛОВАРЬ ВИДОВ этого владельца, целиком.
  //
  // Это ответ на вопрос «что вообще можно назвать в `SubscriptionRequest.kinds`».
  // До него ответа не было НИ ОДНОГО: словарь принадлежит владельцу, объявлен
  // закрытым, а прочесть его было неоткуда — оставался перебор против отказа на
  // живой ручке. Перебор не воспроизводится при добавлении домена: новый
  // владелец заводит свои виды, и узнать о них снова стало бы неоткуда.
  //
  // # ПОЧЕМУ ЗДЕСЬ, А НЕ ПЕРЕЧИСЛЕНИЕМ В КОНТРАКТЕ И НЕ ОТДЕЛЬНЫМ ГЛАГОЛОМ
  //
  // Перечислением НЕЛЬЗЯ: словарь принадлежит владельцу, а эта форма — общая.
  // Перечисление в ней означало бы, что виды всех владельцев объявлены здесь, и
  // тогда владелец, чьи события не про ресурс, а про субъект прав, в форму не
  // поместился бы вовсе — ровно то, что оговорено у поля `kinds`. Плюс каждый
  // новый вид становился бы правкой ОБЩЕГО контракта, то есть словарь пополнялся
  // бы правкой документа, а не по построению.
  //
  // Отдельным глаголом МОЖНО, и цена измерена, а не предположена: глагол — это
  // вторая запись каталога прав (обе встроенные копии обязаны остаться
  // байт-идентичными), регистрация у КАЖДОГО владельца, второй путь на крае и
  // второе место, где словарь может разойтись с тем, чем сервер на самом деле
  // судит. Здесь же он не может разойтись by construction: сервер отдаёт ровно
  // тот перечень, которым отвергает неизвестный вид.
  //
  // Служебное сообщение приходит ПЕРВЫМ и ВСЕГДА и уже везётся по проводу — то
  // есть поверхность не расширяется вовсе, а до браузера словарь доезжает через
  // существующую проекцию края без единой её правки.
  //
  // # КАК ЕГО ПРОЧИТАТЬ, НЕ ЗНАЯ НИ ОДНОГО ВИДА
  //
  // Открыть подписку, НЕ называя `kinds`: незаданная ось не сужает, отказа не
  // будет, а первое же сообщение принесёт словарь целиком. Названный неизвестный
  // вид отвергается ДО открытия — поэтому узнать словарь отказом нельзя, и
  // отказ по этой причине называет его сам.
  //
  // # ПОРЯДОК ЗНАЧИМ: перечень отсортирован
  //
  // Он приходит в возрастающем лексикографическом порядке, и это ЧАСТЬ
  // КОНТРАКТА, а не «как получилось»: словарь живёт отображением, обход
  // отображения в Go случаен by construction, и клиент, ведущий своё состояние
  // по индексу, читал бы каждое открытие как смену словаря.
  //
  // # ЧТО ЭТО НЕ ЗНАЧИТ
  //
  // Не значит «по каждому из них тебе придут события»: словарь есть объявление
  // ВЛАДЕЛЬЦА, а не выборка по правам вызывающего. Показ решается построчно, и
  // вид, на который у вызывающего нет прав, остаётся в словаре — иначе перечень
  // стал бы способом узнать, что кому доступно.
  //
  // Пустым не бывает: владелец с пустым словарём не поднимается вовсе — поток,
  // из которого не доставляется ничего, объявлением подписки не является.
  repeated string known_kinds = 6;
}

// SubscriptionEvent — оболочка события: то, что приходит в потоке после
// `SubscriptionOpened`.
//
// # Что в оболочке, а что в нагрузке
//
// В оболочке лежит всё, по чему сервер принимает решения и по чему клиент ведёт
// своё состояние: позиция, вид, идентификатор, ЯКОРЬ АВТОРИЗАЦИИ и род
// изменения. В нагрузке — состояние предмета, специфичное для владельца.
//
// # Причины остановки потока здесь НЕТ, и это намеренно
//
// Ничто в этой форме не обязывает сервер сообщать исход остановки полезной
// нагрузкой: закрытие потока (в том числе по отозванному доступу) остаётся
// статусом вызова, который следующая фаза вправе выбрать отличимым. Обязательное
// поле «причина остановки» внутри события загнало бы этот исход в контракт
// данных.
message SubscriptionEvent {
  // Change — род изменения предмета.
  enum Change {
    // Не назван. Владелец обязан назвать род изменения: подписчик, ведущий своё
    // состояние, иначе не знает, добавить строку, обновить её или снять.
    CHANGE_UNSPECIFIED = 0;

    CREATED = 1;
    UPDATED = 2;
    DELETED = 3;
  }

  // StateUnavailable — вторая ветвь носителя: состояние предмета недоступно.
  //
  // Это НЕ причина остановки потока и не отказ вызова: поток продолжается, а
  // подписчик узнаёт, что по этому конкретному событию состояния не будет.
  message StateUnavailable {
    // Reason — почему состояния нет. Словарь закрыт: «прочее» здесь не
    // заводится, потому что корзина «прочее» перестаёт различать через месяц.
    enum Reason {
      // Не названа. Владелец обязан назвать причину; значение оставлено нулевым
      // ради совместимости разбора, а не как законный исход.
      REASON_UNSPECIFIED = 0;

      // Состояние не удалось сериализовать.
      NOT_SERIALIZABLE = 1;

      // Состояние на эту позицию владельцем больше не удерживается.
      NOT_RETAINED = 2;

      // Состояние есть, но вызывающему не показывается.
      WITHHELD = 3;

      // Состояние по этому предмету владельцем НЕ ПРОИЗВОДИТСЯ.
      //
      // Это СВОЙСТВО ЖУРНАЛА, а не сбой: собирать было нечего, попытки не было,
      // и повтор ничего не изменит. Тем оно и отличается от `NOT_SERIALIZABLE`,
      // где состояние есть, а собрать его не удалось: там разумное действие —
      // перечитать, здесь — сразу идти за предметом по `resource_id` (либо снять
      // его из своего состояния, если род изменения `DELETED`).
      //
      // Случая два, и оба живые: владелец, чей журнал не несёт состояния ни у
      // одного вида, и событие снятия — предмета больше нет, собирать нечего
      // by construction.
      //
      // Значение ДОБАВЛЕНО к закрытому словарю, а не заведено корзиной «прочее»:
      // до него владелец, у которого состояния не бывает, был вынужден называть
      // причиной соседнюю запись — то есть утверждать неудавшуюся попытку там,
      // где попытки не было. Подписчик, не знающий этого значения, читает его
      // как «состояния не будет» — ровно то, что означает ветвь.
      NOT_PRODUCED = 4;
    }

    Reason reason = 1;
  }

  // position — позиция ЭТОГО события. Непрозрачна; клиент запоминает её и
  // возвращает дословно, чтобы возобновиться отсюда.
  string position = 1;

  // kind — вид предмета из закрытого словаря ВЛАДЕЛЬЦА, в том же написании, в
  // каком его принимает ось `SubscriptionRequest.kinds` и в каком его
  // перечисляет `SubscriptionOpened.known_kinds`.
  //
  // Написание одно на всё дерево — тип объекта модели прав; чем оно держится и
  // почему выбрано именно оно, сказано у поля `kinds`. Слово, которым владелец
  // записал строку в своём журнале, сюда не попадает: оно частное.
  string kind = 2;

  // resource_id — неизменяемый идентификатор предмета. По нему сужает ось
  // `SubscriptionRequest.ids`.
  //
  // Может быть пуст: не всякое событие относится к ресурсу (предметом бывает
  // субъект прав), и непустой идентификатор ресурса не является условием ни
  // открытия подписки, ни доставки события.
  string resource_id = 3;

  // project_id — АВТОРИЗУЕМЫЙ ЯКОРЬ, и он стоит полем ОБОЛОЧКИ, а не внутри
  // нагрузки.
  //
  // Решение «кому это показать» принимается по нему БЕЗ обращения к предмету.
  // Для события удаления это несущее: обратиться не к чему — предмета больше
  // нет, а нагрузка у удаления беднее всего. Якорь внутри нагрузки означал бы
  // выбор из двух негодных: спрашивать модель прав про несуществующий объект
  // либо не показывать удаления вовсе. Второе наступает ТИХО, и цена его — та
  // самая, ради которой заводится подписка: потребитель, снявший поллинг,
  // никогда не узнает об удалении и будет держать удалённые строки вечно.
  //
  // Пусто означает «событие не принадлежит проекту» — предмет уровня аккаунта
  // или кластера. Это законное состояние, а не пропуск.
  string project_id = 4;

  // change — род изменения. Словарь платформенный, в отличие от `kind`: действие
  // потребителя зависит именно от него, и различать снос от правки обязан уметь
  // всякий подписчик, не зная домена.
  Change change = 5;

  // Носитель нагрузки — ВЫБОР ИЗ ДВУХ ВЕТВЕЙ: состояние ЛИБО признак, что
  // состояния нет.
  //
  // Ветвление здесь потому, что запретить прозой значение, которое допускает
  // собственный тип, невозможно. Пустая нагрузка НИКОГДА не означает «у предмета
  // не осталось полей»: подставить пустой объект вместо признака недоступности
  // в этой форме просто негде.
  //
  // Подписчик, получивший непустую нагрузку, вправе читать её как ПОЛНОЕ
  // состояние предмета — и это единственный случай, когда он вправе так делать.
  oneof carrier {
    // state — состояние предмета. Тип НАЗВАН: `Any` несёт имя типа на проводе,
    // и ключи нагрузки суть поля этого типа, объявленные контрактом владельца.
    //
    // Свободной структуры здесь нет намеренно. У неё ключи на проводе
    // производятся от имён идентификаторов Go, `buf breaking` этого не видит
    // by construction (в контракте написано «объект»), и обычный внутренний
    // рефактор молча ломает публичную нагрузку.
    google.protobuf.Any state = 10;

    // state_unavailable — состояния по этому событию не будет, и сказано почему.
    StateUnavailable state_unavailable = 11;
  }
}
