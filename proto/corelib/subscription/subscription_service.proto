syntax = "proto3";

package corelib.subscription;

import "corelib/subscription/subscription.proto";
import "corelib/authz/v1/authz_options.proto";

option go_package = "github.com/PRO-Robotech/corelib/api/corelib/subscription;subscriptionv1";

// Глагол подписки платформы и носитель его потока.
//
// # Почему ОТДЕЛЬНЫЙ файл от формы
//
// Форма (`subscription.proto`) обязана импортироваться кем угодно и потому не
// зависит ни от одного контракта дерева. Глагол несёт аннотации каталога прав —
// зависимость от контракта другого домена, — и, лежи он рядом с формой, форма
// перестала бы быть общей.
//
// Разделение не косметическое: домены импортируют ФОРМУ (чтобы говорить на одном
// языке подписки) и НЕ обязаны импортировать глагол — его регистрирует общий
// сервер `corelib/subscription`, один на платформу.
// SubscriptionMessage — то, что едет по потоку: ЛИБО служебное сообщение
// открытия, ЛИБО событие.
//
// # Зачем носитель, а не «поток событий, а служебное — заголовком»
//
// `SubscriptionOpened` обязано прийти ПЕРВЫМ и ВСЕГДА, в том числе когда событий
// нет вовсе. Поток типа `SubscriptionEvent` этого выразить не может: пришлось бы
// либо возить служебные поля в каждом событии, либо вынести их в метаданные
// вызова — то есть в место, где у них нет ни типа, ни разбора, ни `buf breaking`.
//
// Ветвление, а не два необязательных поля: сообщение, у которого пусты обе
// ветви, в этой форме просто негде построить, и подписчику не приходится решать,
// что значит «оба пусты» или «оба заполнены».
message SubscriptionMessage {
  oneof message {
    // opened — служебное сообщение открытия. Приходит первым и ровно один раз за
    // поток.
    SubscriptionOpened opened = 1;

    // event — событие. Приходит только после `opened`.
    SubscriptionEvent event = 2;
  }
}

// InternalSubscriptionService — ЕДИНСТВЕННЫЙ глагол подписки на платформе.
//
// # Почему имя начинается с `Internal`
//
// Это не украшение: префикс имени службы есть ДЕЙСТВУЮЩИЙ дискриминатор запрета
// #6 на всей популяции методов дерева (`gateway/internal/allowlist`
// `HasInternalSuffix`). Метод с таким именем не попадает во внешний
// маршрутизатор by construction, и проверка этого — не обещание, а обход
// дескрипторов.
//
// Подписку открывает наш же модуль по проверенному сертификату. Проекция потока
// в браузер (kacho#1020) идёт ЧЕРЕЗ КРАЙ, который сам становится потребителем
// этого метода, — а не публикацией метода наружу.
//
// # Где этот глагол доступен КЛИЕНТУ
//
// Недостижимым он не является, и сказать это здесь обязательно: читатель одного
// контракта видит слово `Internal` и заключает «не для меня» — заключение
// неверное, и стоило оно имитации клиента трёх часов.
//
// Клиент открывает поток у КРАЯ: `GET /subscription/v1/events` (Server-Sent
// Events), где владелец журнала называется параметром `owner`, а оси фильтра —
// параметрами `kinds`, `projectId`, `ids` и `start`. Позиция возвращается
// заголовком `Last-Event-ID`. Адрес, словари и кадры описаны страницей
// «Подписка на изменения» документации края; здесь они не воспроизводятся,
// чтобы не завести второго места об одном предмете.
//
// # Один сервис на всех владельцев, а не по сервису на домен
//
// Полное имя метода одно (`/corelib.subscription.InternalSubscriptionService/Subscribe`),
// и каждый владелец журнала регистрирует ЭТОТ сервис на своём внутреннем
// слушателе. Имена gRPC-сервисов уникальны в пределах процесса, а процессы у
// владельцев разные — поэтому одно объявление обслуживает всех, и запись каталога
// прав тоже одна.
//
// Доменного объявления рядом не заводится, и это держит гейт дерева
// (`internal/repohygiene/subscriptionformsingularity.go`), а не эта фраза.
//
// # Только внутренний слушатель
//
// Внешнего пути у метода нет: `google.api.http` не объявлен, а имя службы
// выводит её из внешнего маршрутизатора механически (см. выше).
service InternalSubscriptionService {
  // Subscribe — открыть поток изменений журнала владельца.
  //
  // # Решение о показе принимается НА КАЖДОЙ ОТДАВАЕМОЙ СТРОКЕ
  //
  // Единого объекта, о котором можно было бы задать ОДИН вопрос при открытии, у
  // этого метода не существует: поток несёт события разных предметов разных
  // проектов, и какие именно — заранее не известно. Поэтому метод объявлен
  // `scope_filtered`: край пообъектного вопроса не задаёт, а владелец сужает
  // поток по правам вызывающего на каждой строке, партиями, тем же сужателем,
  // что и списки.
  //
  // Следствие, названное прямо: у метода НЕТ полосы, на которую можно было бы
  // откатиться при неработающем сужателе. Сервер отказывает в открытии потока,
  // если сужатель отсутствует либо не сужает, а боевая стража отказывает в
  // старте процессу, объявившему `scope_filtered` без работающего фильтра.
  //
  // # Что этот метод НЕ делает
  //
  // Он не заменяет полл операции: событие пишется в той же транзакции, что и
  // ресурсная строка, поэтому при отказе операции события нет ВОВСЕ, и
  // наблюдатель ресурсов не отличит «ещё делается» от «упало».
  rpc Subscribe(SubscriptionRequest) returns (stream SubscriptionMessage) {
    option (corelib.authz.v1.permission)       = "platform.subscription.subscribe";
    option (corelib.authz.v1.scope_filtered)   = true;
    option (corelib.authz.v1.required_acr_min) = "1";
  }
}
