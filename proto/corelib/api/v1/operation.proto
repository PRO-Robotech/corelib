syntax = "proto3";

package corelib.api.v1;

import "google/protobuf/descriptor.proto";

option go_package = "github.com/PRO-Robotech/corelib/api/corelib/api/v1;apiv1";

// Разметка длящейся операции — словарь, которым КАЖДЫЙ домен помечает свои
// глаголы.
//
// ПОЧЕМУ ФАЙЛ ЛЕЖИТ ПОД НЕЙТРАЛЬНЫМ КОРНЕМ (задача #2395, форма #2089)
// --------------------------------------------------------------------------
// Словарь не принадлежит НИ ОДНОМУ из двух продуктов: платформа размечает им
// свои контракты, служба доступа — свои, и ни одна сторона не является для
// другой источником. Пока он лежал под корнем платформы, 17 контрактов
// выносимой службы зависели от дерева платформы РАДИ ОДНОЙ РАЗМЕТКИ — стрелка
// против целевой раскладки, в которой каждый продукт смотрит на фундамент и ни
// один на другой продукт. Под `corelib/` обе стороны смотрят на него ВНИЗ, и
// разметка не заводит ребра между корнями продуктов вовсе.
//
// Своих потребителей файл не называет намеренно: нейтральный словарь,
// перечисляющий, кто им пользуется, перестаёт быть нейтральным в день, когда
// перечень меняется.
//
// ИМЯ ПАКЕТА. Взят корневой обмен `kacho.cloud` → `corelib`, а не описательное
// `corelib.operation.v1`: РЕСУРС операции — отдельный предмет, он лежит под
// `kacho.cloud.operation` (`kacho/cloud/operation/operation.proto`), и его имя
// решением 2026-09-14 НЕ переименовывается: это внешне адресуемая координата,
// которую опрашивает каждый асинхронный клиент (запрет ядра #15). Два разных
// предмета под одним именем развели бы читателя молча, поэтому здесь `api.v1`
// (разметка глагола), а там `operation` (сама длящаяся операция).
//
// Здесь стояло «(`kacho.cloud.operation.v1`), который придёт под это имя своим
// переездом». Пакета с таким именем не существовало НИ РАЗУ — ресурс звался
// `kacho.cloud.operation`, без суффикса версии, — а переезд, который абзац
// предсказывал, ОТВЕРГНУТ. Предсказание было неверно и в имени источника, и в
// самом событии, а читалось как координата.
//
// ЗАГЛУШКИ ЭТОГО ФАЙЛА ПОРОЖДАЮТСЯ ЗДЕСЬ. Модуль —
// `github.com/PRO-Robotech/corelib`, его и называет `go_package` выше;
// объявление генерации — `proto/buf.gen.yaml` ЭТОГО репозитория, а сходимость
// дерева с регенерацией держит `generate-diff` в его конвейере.
//
// Здесь стояло «заглушки БЕРУТСЯ из него и здесь не порождаются
// (`proto/buf.gen.yaml` исключает класс фундамента из входа)». Фраза верна для
// КОПИИ ЭТОГО ФАЙЛА В ДЕРЕВЕ ПЛАТФОРМЫ и неверна здесь: она говорит про ДОМ, а
// не про контракт.
//
// ДОМОВ У ФАЙЛА СЕГОДНЯ ДВА, И ЭТО НАЗВАНО, А НЕ УМОЛЧАНО. Тот же путь лежит в
// деревьях платформы и службы доступа — как ВХОД их генераторов, заглушек из
// него не порождает ни одна. Пара, чья проза говорит о СВОЁМ доме, при двух
// домах побайтово совпасть НЕ МОЖЕТ by construction: два абзаца выше в двух
// копиях обязаны различаться, пока копий две. Перепись пар, предикат и событие
// истечения второго дома — в шапке
// `authz/catalogderive/publishedmarkup_test.go`; здесь они не пересказываются.
//
// НОМЕР РАСШИРЕНИЯ ПРИ ПЕРЕЕЗДЕ НЕ МЕНЯЛСЯ, И ЭТО НЕСУЩЕЕ. Два блока
// `extend google.protobuf.MethodOptions` с одним номером в одном образе
// сталкиваются при РЕГИСТРАЦИИ ДЕСКРИПТОРОВ — это отказ времени выполнения, а
// не ошибка сборки. Поэтому здесь ПЕРЕЕЗД, а не копия: второго объявления
// номера 87334 в дереве нет.
extend google.protobuf.MethodOptions { Operation operation = 87334; }

// Operation is annotation for rpc that returns longrunning operation, describes
// message types that will be returned in metadata [google.protobuf.Any], and
// in response [google.protobuf.Any] (for successful operation).
message Operation {
  // Optional. If present, rpc returns operation which metadata field will
  // contains message of specified type.
  string metadata = 1; // Optional.

  // Required. rpc returns operation, in case of success response will contains message of
  // specified field.
  string response = 2; // Required.
}
