# buf.gen.yaml — порождение заглушек контрактов ФУНДАМЕНТА.
#
# ПЛАГИНЫ ЗОВУТСЯ ЧЕРЕЗ `go run` ИЗ `go.mod`, а не берутся из `PATH`. Содержимое
# заглушки решает версия ПЛАГИНА, а не версия buf; взятый из системы плагин даёт
# дифф в файлах, которых изменение не касалось, и воспроизвести это у соседа
# нельзя вовсе. Через `go run` версия приходит из `go.mod` в момент вызова —
# то есть та же, что у потребителя.
#
# ВОСПРОИЗВОДИМОСТЬ РЕЦЕПТА ДОКАЗАНА, А НЕ ОБЪЯВЛЕНА: заглушки, порождённые этим
# объявлением, сверены побайтово с теми, что лежали в `api/` до заведения дома
# контрактов. Расхождений ноль — значит рецепт тот же, каким их порождали
# прежде из дерева платформы, и переезд входа производного не двигает.
#
# ВЫХОД — `../api`, А НЕ `../pkg/api`, как у двух соседей: у фундамента каталога
# `pkg/` нет, его пакеты лежат в корне модуля. Путь выбран по факту дерева, а не
# по образцу.
#
# ВХОД СУЖЕН ПО `corelib` И `kacho` НАМЕРЕННО, И ВТОРОЙ КОРЕНЬ ЗДЕСЬ НЕ ОПИСКА.
# Каталог `google` — вендорный вход (его файлы принадлежат googleapis, а не нам),
# и порождать из него заглушки нельзя: их публикуют чужие модули, уже
# присутствующие в `go.mod`, и второй пакет, регистрирующий то же имя файла, дал
# бы панику при регистрации дескрипторов — отказ времени выполнения, приходящий
# транзитивно у потребителя.
#
# ПОЧЕМУ КОНТРАКТ ФУНДАМЕНТА ЛЕЖИТ ПОД КОРНЕМ ПЛАТФОРМЫ. Ресурс длящейся
# операции адресуется `kacho.cloud.operation` (`kacho/cloud/operation/**`),
# заглушки публикует ЭТОТ модуль, а имя пакета решением 2026-09-14 НЕ
# переименовывается: это внешне адресуемая координата, которую опрашивает каждый
# асинхронный клиент (запрет ядра #15). Переименование было испробовано и
# отозвано — радиус замерен на `origin/release/kc-w5` (единица счёта названа
# вместе с числом, иначе величины несравнимы): контрактов, несущих
# `import "kacho/cloud/operation/operation.proto"`, — 24; не-тестовых файлов Go
# платформы, импортирующих опубликованный пакет заглушек, — 96.
#
# Отсюда следствие, которое надо знать, правя этот файл: корень `kacho` тут
# содержит РОВНО три пути операции и ничего больше. Расширить его до всего
# `kacho/**` нельзя — остальное принадлежит платформе, и второй публикатор тех же
# имён файлов дал бы ту же панику регистрации, что и вендорный `google`.
version: v2
plugins:
  - local: [go, run, google.golang.org/protobuf/cmd/protoc-gen-go]
    out: ../api
    opt: paths=source_relative
  - local: [go, run, google.golang.org/grpc/cmd/protoc-gen-go-grpc]
    out: ../api
    opt:
      - paths=source_relative
      - require_unimplemented_servers=true
  - local: [go, run, github.com/grpc-ecosystem/grpc-gateway/v2/protoc-gen-grpc-gateway]
    out: ../api
    opt:
      - paths=source_relative
      - generate_unbound_methods=true
inputs:
  - directory: .
    paths:
      - corelib
      - kacho
